<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incubadora de Empresarios</title>
<style>
  :root{
    --bg:#0b0b12;--bg2:#12121d;--surface:#161623;--surface-2:#1c1c2c;
    --accent:#2E6FE0;--accent2:#6FA3F0;--pink:#D4AF37;
    --good:#22c55e;--warn:#f59e0b;--danger:#ef4444;
    --ink:#e9e9f2;--muted:#a7a7c0;--faint:#6f6f8c;--line:#26263a;--line2:#33334a;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#0d2044 0%,transparent 60%),var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .inp,select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line2);border-radius:10px;color:var(--ink);padding:10px 12px;font-size:14px;font-family:var(--sans)}
  .inp:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .field{margin-bottom:12px}.field label{display:block;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;font-family:var(--mono)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .btn{border:1px solid var(--line2);background:var(--surface-2);color:var(--ink);padding:9px 16px;border-radius:10px;font-size:14px;cursor:pointer;font-weight:600}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#6d4eee}
  .btn.ghost{background:transparent}
  .btn.danger{border-color:var(--danger);color:var(--danger);background:transparent}
  .card{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin:0 0 18px}
  .card h3{margin:0 0 4px;font-size:16px}
  .cdesc{color:var(--muted);font-size:13.5px;margin:0 0 14px}
  .actions{display:flex;align-items:center;gap:10px;margin-top:14px}
  .grow{flex:1}
  .chip{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 9px;border-radius:20px;display:inline-block}
  .chip.fluido{color:#4ade80;background:rgba(34,197,94,.14)}.chip.potencial{color:var(--accent2);background:rgba(46,111,224,.14)}
  .chip.leve{color:var(--faint);background:rgba(111,111,140,.16)}.chip.no_respondido{color:var(--faint);background:rgba(111,111,140,.08)}
  .chip.pendiente{color:#fbbf24;background:rgba(245,158,11,.14)}.chip.cobrado{color:#4ade80;background:rgba(34,197,94,.14)}.chip.vencido{color:#f87171;background:rgba(239,68,68,.14)}
  .tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:14px}
  thead th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bg2)}
  tbody td{padding:13px 14px;border-bottom:1px solid var(--line);color:var(--muted);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}tbody tr.clk:hover{background:var(--surface-2);cursor:pointer}
  .nm{color:var(--ink);font-weight:600}.sub2{font-size:11.5px;color:var(--faint)}
  .empty{padding:30px;text-align:center;color:var(--faint)}
  .top{display:flex;align-items:center;gap:16px;padding:0 0 22px}
  .top .sub{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2)}
  .top h1{margin:2px 0 0;font-size:24px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-2);border:1px solid var(--line2);color:var(--ink);padding:12px 22px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:999;font-size:14px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .overlay{position:fixed;inset:0;background:rgba(5,5,10,.7);display:flex;align-items:flex-start;justify-content:center;padding:5vh 20px;overflow:auto;z-index:100}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 28px;max-width:640px;width:100%;margin-bottom:5vh}
  .modal h2{margin:0 0 18px;font-size:19px}
  .listrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
  .listrow:last-child{border-bottom:none}
  .pg{border:1px solid var(--line2);background:var(--surface-2);color:var(--ink);padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer}
  .pg:hover{border-color:var(--accent)}
  /* login */
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login .box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:34px 32px;max-width:380px;width:100%}
  .login .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .login .brand b{font-size:20px}
  .login h1{font-size:20px;margin:0 0 6px}
  .login p{color:var(--muted);font-size:13.5px;margin:0 0 20px}
  .login .alt{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}
  .login .alt a{color:var(--accent2);cursor:pointer;font-weight:600}
  /* shell */
  #app{display:flex;min-height:100vh}
  .side{width:230px;flex:0 0 auto;background:var(--surface);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column}
  .side .brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;font-weight:800;font-size:14px;line-height:1.3}
  .side .brand .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--pink))}
  .nav{flex:1;display:flex;flex-direction:column;gap:2px}
  .nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:14px;cursor:pointer}
  .nav a:hover{background:var(--surface-2);color:var(--ink)}
  .nav a.on{background:rgba(46,111,224,.14);color:var(--accent2);font-weight:600}
  .nav .grp{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:14px 0 4px 12px}
  .me{display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
  .me .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--pink));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;flex:0 0 auto}
  .me .nm{font-size:13px}.me .rl{font-size:11px;color:var(--faint);text-transform:capitalize}
  .me .out{margin-left:auto;background:none;border:none;color:var(--faint);cursor:pointer;font-size:16px}
  .main{flex:1;padding:30px 34px;max-width:1200px}
  /* panel general */
  .stats2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  .stat2{background:linear-gradient(135deg,rgba(46,111,224,.16),rgba(212,175,55,.10));border:1px solid var(--line2);border-radius:18px;padding:18px 20px;position:relative}
  .stat2 .l{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent2)}
  .stat2 .n{font-size:28px;font-weight:800;margin:6px 0 2px}
  .stat2 .d{font-size:12px;color:var(--faint)}
  .cajas{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
  .caja{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
  .caja .l{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .caja .n{font-size:22px;font-weight:800;margin:6px 0 2px}
  .caja .d{font-size:11.5px;color:var(--faint)}
  .split2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
  .rend{display:flex;flex-direction:column;gap:14px;margin-top:6px}
  .rend .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
  .track{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden}
  .track i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--pink));border-radius:6px}
  @media(max-width:900px){.side{display:none}.stats2,.cajas{grid-template-columns:1fr}.split2{grid-template-columns:1fr}.row2,.row3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

/* ================= CONFIG ================= */
const SUPABASE_URL = 'https://oqdezvqstyxuiwfpyipd.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9xZGV6dnFzdHl4dWl3ZnB5aXBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMTA2OTMsImV4cCI6MjEwMzg4NjY5M30.htwcZjekjr2SHhkPO7NHmUtFGyVp39hKEsbrvi8ScHo'

const root = document.getElementById('root')
let sb=null,me=null,myProfile=null
let state={setters:[]}
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const initials=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()
const isMgr=()=>myProfile&&(myProfile.rol==='manager'||myProfile.rol==='admin')
const fmtCur=(n,mon)=>(mon||'USD')+' '+(Number(n||0)).toLocaleString('es',{minimumFractionDigits:2,maximumFractionDigits:2})
const num=n=>(Number(n||0)).toLocaleString('es')
const nameOf=id=>{const s=state.setters.find(x=>x.id===id);return s?s.nombre:null}
const TEMPS=['no_respondido','leve','fluido','potencial']
const tempLabel={no_respondido:'No respondido',leve:'Leve',fluido:'Fluido',potencial:'Potencial'}
const FUENTES=['Instagram','TikTok','YouTube','Referido','Otro']
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)}
function fmtDate(s){if(!s)return'—';const d=new Date(s),n=new Date();if(d.toDateString()===n.toDateString())return'hoy '+d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});return d.toLocaleDateString('es',{day:'2-digit',month:'2-digit'})}
function fmtDateTime(s){if(!s)return'—';const d=new Date(s);return d.toLocaleDateString('es',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}
async function delRow(table,id){const{data,error}=await sb.from(table).delete().eq('id',id).select('id')
  if(error)return{ok:false,msg:error.message}
  if(!data||!data.length)return{ok:false,msg:'No se borró nada — revisá los permisos.'}
  return{ok:true}}

function view(){return document.getElementById('view')}
function head(sub,title,actions=''){return `<div class="top"><div><div class="sub">${sub}</div><h1>${title}</h1></div><div class="grow"></div>${actions}</div>`}

/* ================= AUTH SCREENS ================= */
function renderConfigNeeded(){root.innerHTML=`<div class="login"><div class="box"><h1>Falta configurar Supabase</h1><p>Completá SUPABASE_URL y SUPABASE_ANON_KEY arriba del archivo (dentro del &lt;script&gt;).</p></div></div>`}
function renderLogin(){
  root.innerHTML=`<div class="login"><div class="box">
    <div class="brand"><div style="width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--pink))"></div><b>Incubadora de Empresarios</b></div>
    <h1 id="lg_title">Ingresá</h1><p id="lg_sub">Accedé con tu cuenta del equipo.</p>
    <div class="field"><label>Email</label><input class="inp" id="lg_email" type="email" placeholder="vos@jb.com"/></div>
    <div class="field"><label>Contraseña</label><input class="inp" id="lg_pass" type="password" placeholder="••••••••"/></div>
    <div class="field" id="lg_namewrap" style="display:none"><label>Nombre</label><input class="inp" id="lg_nombre" placeholder="Tu nombre"/></div>
    <button class="btn primary" style="width:100%" id="lg_go">Entrar</button>
    <div class="alt" id="lg_switch">¿No tenés cuenta? <a id="lg_toggle">Crear una</a></div>
  </div></div>`
  let mode='login'
  document.getElementById('lg_toggle').onclick=()=>{mode=mode==='login'?'signup':'login'
    document.getElementById('lg_title').textContent=mode==='login'?'Ingresá':'Creá tu cuenta'
    document.getElementById('lg_sub').textContent=mode==='login'?'Accedé con tu cuenta del equipo.':'Te asignamos el rol después de que entres.'
    document.getElementById('lg_namewrap').style.display=mode==='signup'?'block':'none'
    document.getElementById('lg_switch').innerHTML=mode==='login'?'¿No tenés cuenta? <a id="lg_toggle2">Crear una</a>':'¿Ya tenés cuenta? <a id="lg_toggle2">Ingresá</a>'
    document.getElementById('lg_toggle2').onclick=document.getElementById('lg_toggle').onclick}
  document.getElementById('lg_go').onclick=async()=>{
    const email=document.getElementById('lg_email').value.trim(),pass=document.getElementById('lg_pass').value
    if(!email||!pass){toast('Completá email y contraseña');return}
    if(mode==='signup'){
      const nombre=document.getElementById('lg_nombre').value.trim()
      const{data,error}=await sb.auth.signUp({email,password:pass,options:{data:{nombre}}})
      if(error){toast('Error: '+error.message);return}
      if(data.session)await afterLogin(data.session);else toast('Revisá tu email para confirmar la cuenta')
    }else{
      const{data,error}=await sb.auth.signInWithPassword({email,password:pass})
      if(error){toast('Error: '+error.message);return}
      await afterLogin(data.session)
    }}}
function renderError(e){root.innerHTML=`<div class="login"><div class="box"><h1>Ups, algo falló</h1><p>${esc((e&&e.message)||e||'Error desconocido')}</p><button class="btn primary" style="width:100%" onclick="location.reload()">Reintentar</button></div></div>`}

async function afterLogin(session){
  me=session.user
  let{data:prof}=await sb.from('profiles').select('*').eq('id',me.id).single()
  if(!prof){await sb.from('profiles').insert({id:me.id,email:me.email,nombre:me.email});const r=await sb.from('profiles').select('*').eq('id',me.id).single();prof=r.data}
  myProfile=prof
  const{data:profs}=await sb.from('profiles').select('*').eq('activo',true).order('nombre')
  state.setters=profs||[]
  renderShell();route()}

/* ---------- SHELL + ROUTER ---------- */
const NAV=[
  {g:null,items:[['#/panel','Panel general',null],['#/guia','Guía',null]]},
  {g:'Setter',items:[['#/leads','Leads',['setter']],['#/nuevo','Nuevo lead',['setter']],['#/kpis','KPIs diarios',['setter']]]},
  {g:'Closer',items:[['#/triage','Triage',null],['#/reporte','Reporte de llamadas',null],['#/grilla','Grilla de reportes',null]]},
  {g:'Ventas',items:[['#/ventas','Ventas',null]]},
  {g:'Marketing',items:[['#/marketing','Rendimiento de marketing',null]]},
  {g:'Cobros',items:[['#/cobros','Cobros',null],['#/comisiones','Comisiones',null]]},
  {g:'Equipo',items:[['#/equipo','Roles y %',[]]]}]
function renderShell(){
  const canSee=roles=>isMgr()||!roles||roles.includes(myProfile.rol)
  const nav=NAV.map(s=>{const items=s.items.filter(([,,roles])=>canSee(roles));if(!items.length)return ''
    return `${s.g?`<div class="grp">${s.g}</div>`:''}${items.map(([h,l])=>`<a data-h="${h}"><span>${l}</span></a>`).join('')}`}).join('')
  root.innerHTML=`<div id="app"><aside class="side">
    <div class="brand"><div class="dot"></div>Incubadora de Empresarios</div>
    <nav class="nav">${nav}</nav>
    <div class="me"><div class="av">${initials(myProfile.nombre)}</div><div><div class="nm">${esc(myProfile.nombre||me.email)}</div><div class="rl">${esc(myProfile.rol)}</div></div><button class="out" id="so" title="Salir">⎋</button></div>
    </aside><main class="main" id="view"></main></div>`
  root.querySelectorAll('.nav a').forEach(a=>a.onclick=()=>location.hash=a.dataset.h)
  document.getElementById('so').onclick=()=>sb.auth.signOut();window.onhashchange=route}
function setActive(){root.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.h===location.hash))}
function route(){setActive();const h=location.hash
  const map={'#/panel':renderPanel,'#/guia':renderGuia,'#/leads':renderLeads,'#/nuevo':()=>openLeadModal(),'#/kpis':renderKpis,'#/triage':renderTriage,'#/reporte':renderReporte,'#/grilla':renderGrilla,'#/ventas':renderVentas,'#/marketing':renderMarketing,'#/cobros':renderCobros,'#/comisiones':renderComisiones,'#/equipo':renderEquipo}
  ;(map[h]||renderPanel)()}

/* ================= PANEL GENERAL ================= */
async function renderPanel(){
  view().innerHTML=head('DASHBOARD','Panel general')+`
    <div class="stats2">
      <div class="stat2"><div class="l">Facturación</div><div class="n" id="pg_fact">—</div><div class="d">lo vendido</div></div>
      <div class="stat2"><div class="l">Cash collected</div><div class="n" id="pg_cash">—</div><div class="d">lo cobrado</div></div>
    </div>
    <div class="cajas" id="pg_cajas"></div>
    <div class="split2">
      <div class="card" style="margin:0"><h3>Evolución de facturación</h3><p class="cdesc">Últimos 30 días, acumulado</p><div id="pg_chart"></div></div>
      <div class="card" style="margin:0"><h3>Rendimiento por caja</h3><p class="cdesc">Cuánto de lo cobrado puso cada caja</p><div class="rend" id="pg_rend"></div></div>
    </div>`
  const{data:ventas}=await sb.from('ventas').select('id,ticket,moneda,origen,created_at').limit(5000)
  const{data:cuotas}=await sb.from('cuotas').select('monto,moneda,estado,origen,cobrado_at').eq('estado','cobrado').limit(5000)
  const monedas=Array.from(new Set([...(ventas||[]).map(v=>v.moneda||'USD'),...(cuotas||[]).map(c=>c.moneda||'USD')]))
  const mon=monedas[0]||'USD'
  const fact=(ventas||[]).filter(v=>(v.moneda||'USD')===mon).reduce((a,v)=>a+Number(v.ticket||0),0)
  const cash=(cuotas||[]).filter(c=>(c.moneda||'USD')===mon).reduce((a,c)=>a+Number(c.monto||0),0)
  document.getElementById('pg_fact').textContent=fmtCur(fact,mon)
  document.getElementById('pg_cash').textContent=fmtCur(cash,mon)
  const bucket=(arr,pred)=>arr.filter(c=>(c.moneda||'USD')===mon&&pred(c)).reduce((a,c)=>a+Number(c.monto||0),0)
  const caja1=bucket(cuotas||[],c=>['venta','closing'].includes(c.origen||'venta'))
  const caja2=bucket(cuotas||[],c=>['upsell','resell'].includes(c.origen))
  const caja3=bucket(cuotas||[],c=>c.origen==='manual')
  const cajas=[['Caja 1','plata nueva',caja1],['Caja 2','recompras',caja2],['Caja 3','cuotas manuales',caja3]]
  document.getElementById('pg_cajas').innerHTML=cajas.map(([l,d,n])=>`<div class="caja"><div class="l">${l}</div><div class="n">${fmtCur(n,mon)}</div><div class="d">${d}</div></div>`).join('')
  const total=caja1+caja2+caja3
  document.getElementById('pg_rend').innerHTML=cajas.map(([l,,n])=>{const pct=total?Math.round(n/total*100):0
    return `<div><div class="row"><span>${l}</span><span>${pct}%</span></div><div class="track"><i style="width:${pct}%"></i></div><div class="sub2" style="margin-top:4px">${fmtCur(n,mon)}</div></div>`}).join('')||'<div class="empty">Sin cobros todavía.</div>'
  // evolución 30 días (acumulado de ventas por día)
  const days=[];const today=new Date()
  for(let i=29;i>=0;i--){const d=new Date(today);d.setDate(d.getDate()-i);days.push(d.toISOString().slice(0,10))}
  let acc=0;const pts=days.map(d=>{const dayTotal=(ventas||[]).filter(v=>(v.moneda||'USD')===mon&&(v.created_at||'').slice(0,10)===d).reduce((a,v)=>a+Number(v.ticket||0),0);acc+=dayTotal;return acc})
  const max=Math.max(1,...pts)
  const w=560,h=160,stepX=w/(pts.length-1||1)
  const path=pts.map((v,i)=>`${i===0?'M':'L'}${(i*stepX).toFixed(1)},${(h-(v/max*h)).toFixed(1)}`).join(' ')
  const area=`${path} L${w},${h} L0,${h} Z`
  document.getElementById('pg_chart').innerHTML=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:160px"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2E6FE0" stop-opacity="0.35"/><stop offset="100%" stop-color="#2E6FE0" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#ga)"/><path d="${path}" fill="none" stroke="#2E6FE0" stroke-width="2.5"/></svg>`
}

/* ================= LEADS ================= */
async function renderLeads(){const v=view()
  v.innerHTML=head('SETTER','Leads',`<button class="btn primary" id="b_new">+ Nuevo lead</button>`)
    +`<div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Teléfono</th><th>Fuente</th><th>Temp.</th><th>Estado</th><th>Asesor</th><th>Actualizado</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="empty">Cargando…</td></tr></tbody></table></div>`
  v.querySelector('#b_new').onclick=()=>openLeadModal()
  let q=sb.from('leads').select('*').order('updated_at',{ascending:false}).limit(300)
  const{data,error}=await q
  document.getElementById('rows').innerHTML=(data&&data.length)?data.map(l=>`<tr class="clk" data-id="${l.id}"><td class="nm">${esc(l.nombre)}</td><td class="sub2">${esc(l.telefono||'—')}</td><td class="sub2">${esc(l.fuente||'—')}</td><td><span class="chip ${l.temperatura}">${tempLabel[l.temperatura]||l.temperatura}</span></td><td class="sub2">${esc(l.estado||'—')}</td><td class="sub2">${esc(nameOf(l.asesor_id)||'—')}</td><td class="sub2">${fmtDate(l.updated_at)}</td></tr>`).join(''):`<tr><td colspan="7" class="empty">${error?esc(error.message):'Sin leads todavía.'}</td></tr>`

async function openLeadModal(lead){const ov=document.createElement('div');ov.className='overlay'
  const l=lead||{}
  ov.innerHTML=`<div class="modal"><h2>${lead?'Editar lead':'Nuevo lead'}</h2>
    <div class="row2"><div class="field"><label>Nombre *</label><input class="inp" id="m_nombre" value="${esc(l.nombre)}"/></div><div class="field"><label>Teléfono</label><input class="inp" id="m_telefono" value="${esc(l.telefono)}"/></div></div>
    <div class="row2"><div class="field"><label>Contacto (@ig)</label><input class="inp" id="m_contacto" value="${esc(l.contacto)}"/></div><div class="field"><label>Fuente</label><select id="m_fuente">${FUENTES.map(f=>`<option ${l.fuente===f?'selected':''}>${f}</option>`).join('')}</select></div></div>
    <div class="row2"><div class="field"><label>Temperatura</label><select id="m_temp">${TEMPS.map(t=>`<option value="${t}" ${l.temperatura===t?'selected':''}>${tempLabel[t]}</option>`).join('')}</select></div><div class="field"><label>Estado</label><select id="m_estado">${['Nuevo','Contactado','Agendó','Cerrado','Perdido'].map(e=>`<option ${l.estado===e?'selected':''}>${e}</option>`).join('')}</select></div></div>
    <div class="field"><label>Asesor</label><select id="m_asesor"><option value="">— sin asignar —</option>${state.setters.map(s=>`<option value="${s.id}" ${l.asesor_id===s.id?'selected':''}>${esc(s.nombre)}</option>`).join('')}</select></div>
    <div class="field"><label>Situación actual</label><textarea class="inp" id="m_situacion" rows="2">${esc(l.situacion)}</textarea></div>
    <div class="field"><label>Objetivos</label><textarea class="inp" id="m_objetivos" rows="2">${esc(l.objetivos)}</textarea></div>
    <div class="field"><label>Dolor</label><textarea class="inp" id="m_dolor" rows="2">${esc(l.dolor)}</textarea></div>
    <div class="field"><label>Notas</label><textarea class="inp" id="m_notas" rows="2">${esc(l.notas)}</textarea></div>
    <div class="actions">${lead?'<button class="btn danger" id="m_del">Eliminar</button>':''}<div class="grow"></div><button class="btn ghost" id="m_cancel">Cancelar</button><button class="btn primary" id="m_save">Guardar</button></div></div>`
  document.body.appendChild(ov);const g=id=>ov.querySelector('#'+id)
  ov.onclick=e=>{if(e.target===ov)ov.remove()};g('m_cancel').onclick=()=>ov.remove()
  g('m_save').onclick=async()=>{const p={nombre:g('m_nombre').value.trim(),telefono:g('m_telefono').value.trim()||null,contacto:g('m_contacto').value.trim()||null,fuente:g('m_fuente').value,temperatura:g('m_temp').value,estado:g('m_estado').value,asesor_id:g('m_asesor').value||null,situacion:g('m_situacion').value.trim()||null,objetivos:g('m_objetivos').value.trim()||null,dolor:g('m_dolor').value.trim()||null,notas:g('m_notas').value.trim()||null,updated_at:new Date().toISOString()}
    if(!p.nombre){toast('Poné un nombre');return}
    if(p.telefono)p.dedup_key=p.telefono.toLowerCase().replace(/[^a-z0-9]/g,'')
    const res=lead?await sb.from('leads').update(p).eq('id',lead.id):await sb.from('leads').insert(p)
    if(res.error){toast('Error: '+res.error.message);return}
    toast('Guardado ✓');ov.remove();if(location.hash==='#/leads')renderLeads();else location.hash='#/leads'}
  if(lead)g('m_del').onclick=async()=>{if(confirm('¿Eliminar este lead?')){const r=await delRow('leads',lead.id);if(!r.ok){toast(r.msg);return}toast('Eliminado');ov.remove();if(location.hash==='#/leads')renderLeads()}}}

    <div class="row2"><div class="field"><label>Próximo seguimiento</label><input class="inp" id="r_ps" type="date"/></div><div class="field"><label>Próxima acción</label><input class="inp" id="r_pa"/></div></div>

async function saveReporte(){const g=id=>document.getElementById(id)
  let leadId=g('r_lead').value||null
  if(!leadId&&g('r_nuevo').value.trim()){const{data}=await sb.from('leads').insert({nombre:g('r_nuevo').value.trim(),estado:'Contactado'}).select().single();leadId=data.id}
  const resultado=g('r_res').value||null
  const vf=readVentaForm('r_')
  const rep={lead_id:leadId,closer_id:me.id,asistio:g('r_asis').value,resultado,programa:vf.programa,forma_cierre:vf.forma,moneda:vf.moneda,monto_facturado:vf.ticket,monto_upfront:vf.pago,billetera:vf.billetera,situacion:g('r_sit').value.trim(),dolores:g('r_dol').value.trim(),razones_compra:g('r_raz').value.trim(),objecion_principal:g('r_o1').value.trim(),motivo_no_cierre:g('r_mnc').value.trim(),proximo_seguimiento:g('r_ps').value||null,proxima_accion:g('r_pa').value.trim(),feedback:g('r_fb').value.trim()}
  if(resultado==='Cerró'&&!vf.ticket){toast('Cerró: cargá el ticket de la venta');return}
  const{data:repRow,error}=await sb.from('reportes_llamada').insert(rep).select().single();if(error){toast('Error: '+error.message);return}
  if(leadId&&resultado==='Cerró'){try{await saveVenta({...vf,leadId,closerId:me.id,reporteId:repRow.id})}catch(e){toast('Reporte ok, error en venta: '+(e.message||e));return}
    await sb.from('leads').update({estado:'Cerrado'}).eq('id',leadId)}
  else if(leadId&&rep.asistio==='Asistió')await sb.from('leads').update({estado:'Contactado'}).eq('id',leadId)
  if(leadId&&rep.proximo_seguimiento)await sb.from('seguimientos').insert({lead_id:leadId,asesor_id:me.id,fecha_programada:rep.proximo_seguimiento,tipo:'post-call',nota:rep.proxima_accion})
  toast('Reporte guardado ✓');location.hash='#/grilla'}

function ventaFormHTML(p){return `
  <div class="row3"><div class="field"><label>Forma de pago</label><select id="${p}forma"><option>Pago único</option><option>2 cuotas</option><option>3 cuotas</option></select></div>
    <div class="field"><label>Moneda</label><select id="${p}mon"><option>USD</option><option>ARS</option><option>EUR</option></select></div>
    <div class="field"><label>Billetera</label><input class="inp" id="${p}bill"/></div></div>
  <div class="field"><label>Programa</label><input class="inp" id="${p}prog" placeholder="Incubadora / mentoría / etc"/></div>
  <div class="row2"><div class="field"><label>Setter (comisión)</label><select id="${p}setter"><option value="">— sin setter —</option>${state.setters.map(s=>`<option value="${s.id}">${esc(s.nombre)}</option>`).join('')}</select></div>
    <div class="field"><label>Closer (comisión)</label><select id="${p}closer"><option value="">— sin closer —</option>${state.setters.map(s=>`<option value="${s.id}" ${s.id===(me&&me.id)?'selected':''}>${esc(s.nombre)}</option>`).join('')}</select></div></div>
  <div class="row3"><div class="field"><label>Ticket (total)</label><input class="inp" id="${p}ticket" type="number" placeholder="0"/></div>
    <div class="field"><label>Dinero que pagó</label><input class="inp" id="${p}pago" type="number" placeholder="0"/></div>
    <div class="field"><label>Dinero a cobrar</label><input class="inp" id="${p}cobrar" type="number" placeholder="0"/></div></div>
  <div class="field"><label>Base comisionable (tope)</label><input class="inp" id="${p}basecom" type="number" placeholder="= ticket si no hay recargo"/></div>
  <div id="${p}cuotasBox"></div>
  <div class="field"><label>Comprobante de pago</label><input class="inp" id="${p}file" type="file" accept="image/*,application/pdf" style="padding:10px"/></div>`}
function wireVentaForm(p){const g=id=>document.getElementById(p+id)
  function build(){const ticket=Number(g('ticket').value||0),pago=Number(g('pago').value||0),forma=g('forma').value
    const n=forma==='2 cuotas'?1:forma==='3 cuotas'?2:0,resto=Math.max(0,ticket-pago)
    if(document.activeElement!==g('cobrar'))g('cobrar').value=resto?Number(resto.toFixed(2)):''
    const box=g('cuotasBox'),cur=box.querySelectorAll('[data-cuota]').length
    if(n===0){box.innerHTML='';return}
    if(cur!==n){const each=n?resto/n:0;let rows=''
      for(let i=1;i<=n;i++)rows+=`<div class="row2" data-cuota="${i}"><div class="field"><label>Cuota ${i+1} — monto</label><input class="inp cuotaMonto" type="number" value="${each?Number(each.toFixed(2)):''}"/></div><div class="field"><label>Vencimiento cuota ${i+1}</label><input class="inp cuotaVenc" type="date"/></div></div>`
      box.innerHTML=`<div class="sub2" style="margin:8px 0">Cuotas pendientes (a cobrar)</div>${rows}`
      box.querySelectorAll('.cuotaVenc').forEach((el,idx)=>{const d=new Date();d.setMonth(d.getMonth()+idx+1);el.value=d.toISOString().slice(0,10)})}}
  g('ticket').oninput=build;g('pago').oninput=build;g('forma').onchange=build;build()}
function readVentaForm(p){const g=id=>document.getElementById(p+id),cuotas=[]
  document.querySelectorAll('#'+p+'cuotasBox [data-cuota]').forEach(r=>{const monto=Number(r.querySelector('.cuotaMonto').value||0),venc=r.querySelector('.cuotaVenc').value||null;if(monto>0)cuotas.push({monto,vencimiento:venc})})
  return{forma:g('forma').value,moneda:g('mon').value,billetera:g('bill').value.trim(),programa:g('prog').value.trim(),setter:g('setter').value||null,closer:(g('closer')&&g('closer').value)||null,ticket:Number(g('ticket').value||0),pago:Number(g('pago').value||0),cobrar:Number(g('cobrar').value||0),baseComision:(g('basecom')&&Number(g('basecom').value))||0,cuotas,file:(g('file').files&&g('file').files[0])||null}}
async function uploadComprobante(file){if(!file)return null
  const ext=(file.name.split('.').pop()||'bin').toLowerCase(),rnd=Math.random().toString(36).slice(2,8)
  const path=`${Date.now()}-${rnd}.${ext}`
  const{error}=await sb.storage.from('comprobantes').upload(path,file,{upsert:false,contentType:file.type||undefined})
  if(error)throw error
  return sb.storage.from('comprobantes').getPublicUrl(path).data.publicUrl}
const pctOf=(id,field)=>{const p=state.setters.find(x=>x.id===id);return p?Number(p[field]||0):0}
async function saveVenta(v){
  let comprobante_url=v.currentComprobante||null
  if(v.file)comprobante_url=await uploadComprobante(v.file)
  const origen=v.reporteId?'closing':'venta'
  const closerId=v.closer||v.closerId||me.id,setterId=v.setterId||v.setter||null
  const com_setter_pct=setterId?pctOf(setterId,'com_setter_pct'):0,com_closer_pct=pctOf(closerId,'com_closer_pct')
  const venta={lead_id:v.leadId||null,cliente:v.cliente||null,closer_id:closerId,setter_id:setterId,com_setter_pct,com_closer_pct,reporte_id:v.reporteId||null,programa:v.programa||null,moneda:v.moneda,ticket:v.ticket,base_comisionable:(Number(v.baseComision)>0?Number(v.baseComision):v.ticket),pagado:v.pago,a_cobrar:v.cobrar,forma_pago:v.forma,billetera:v.billetera||null,comprobante_url,origen}
  let ventaId=v.editId
  if(v.editId){
    const{data:oc}=await sb.from('cuotas').select('id').eq('venta_id',v.editId)
    if(oc&&oc.length)await sb.from('comision_pagos').delete().in('origen_id',oc.map(c=>c.id))
    await sb.from('cuotas').delete().eq('venta_id',v.editId)
    const{error}=await sb.from('ventas').update(venta).eq('id',v.editId);if(error)throw error
  }else{const{data:vrow,error}=await sb.from('ventas').insert(venta).select().single();if(error)throw error;ventaId=vrow.id}
  const cuotas=[]
  if(v.pago>0)cuotas.push({venta_id:ventaId,lead_id:v.leadId||null,programa:v.programa,moneda:v.moneda,monto:v.pago,estado:'cobrado',origen,billetera:v.billetera,comprobante_url,cobrado_at:new Date().toISOString(),vencimiento:new Date().toISOString().slice(0,10)})
  ;(v.cuotas||[]).forEach(c=>cuotas.push({venta_id:ventaId,lead_id:v.leadId||null,programa:v.programa,moneda:v.moneda,monto:c.monto,estado:'pendiente',origen,billetera:v.billetera,vencimiento:c.vencimiento}))
  if(cuotas.length){const{error:ce}=await sb.from('cuotas').insert(cuotas);if(ce)throw ce}
  return ventaId}
async function renderVentas(){
  view().innerHTML=head('VENTAS','Ventas',`<button class="btn primary" id="v_new">+ Cargar venta</button>`)
    +`<div class="tablewrap"><table><thead><tr><th>Cliente</th><th>Fecha</th><th>Programa</th><th>Forma</th><th>Ticket</th><th>Pagó</th><th>A cobrar</th><th>Comprobante</th></tr></thead><tbody id="vrows"><tr><td colspan="8" class="empty">Cargando…</td></tr></tbody></table></div>`
  document.getElementById('v_new').onclick=()=>openVentaModal()
  let q=sb.from('ventas').select('*,leads(nombre)').order('created_at',{ascending:false}).limit(300)
  const{data,error}=await q
  document.getElementById('vrows').innerHTML=(data&&data.length)?data.map(v=>`<tr class="clk" data-id="${v.id}"><td class="nm">${esc(v.leads?v.leads.nombre:(v.cliente||'—'))}</td><td class="sub2">${fmtDate(v.created_at)}</td><td>${esc(v.programa||'—')}</td><td>${esc(v.forma_pago||'—')}</td><td class="nm">${fmtCur(v.ticket,v.moneda)}</td><td>${fmtCur(v.pagado,v.moneda)}</td><td>${fmtCur(v.a_cobrar,v.moneda)}</td><td>${v.comprobante_url?`<a href="${esc(v.comprobante_url)}" target="_blank" rel="noopener">ver</a>`:'<span class="sub2">—</span>'}</td></tr>`).join(''):`<tr><td colspan="8" class="empty">${error?esc(error.message):'Sin ventas todavía.'}</td></tr>`
  document.querySelectorAll('#vrows tr[data-id]').forEach(tr=>tr.onclick=()=>openVentaModal(data.find(x=>x.id===tr.dataset.id)))}
async function openVentaModal(venta){const isEdit=!!venta
  const{data:leads}=await sb.from('leads').select('id,nombre,asesor_id').limit(300)
  const ov=document.createElement('div');ov.className='overlay'
  ov.innerHTML=`<div class="modal"><h2>${isEdit?'Editar venta':'Cargar venta'}</h2>
    ${isEdit?'<p class="cdesc" style="color:var(--warn)">Editar regenera las cuotas de esta venta.</p>':''}

let COM_LINES=[],COM_PAID=new Set(),MANUAL_PAG={}
async function renderComisiones(){
  view().innerHTML=head('COMISIONES','Comisiones')+`<div class="split2" style="grid-template-columns:1fr 1fr">
      <div class="card" style="margin:0"><h3>Setters</h3><div id="setTbl"><div class="empty">Cargando…</div></div></div>
      <div class="card" style="margin:0"><h3>Closers</h3><div id="cloTbl"><div class="empty">Cargando…</div></div></div>
    </div>`
  const{data:ventas}=await sb.from('ventas').select('id,cliente,lead_id,leads(nombre),setter_id,closer_id,com_setter_pct,com_closer_pct,moneda,base_comisionable,ticket')
  const vmap={};(ventas||[]).forEach(v=>vmap[v.id]=v)
  const{data:cuotas}=await sb.from('cuotas').select('id,monto,venta_id,moneda').eq('estado','cobrado').limit(10000)
  const{data:pagos}=await sb.from('comision_pagos').select('origen_tipo,origen_id,rol')
  const paid=new Set((pagos||[]).map(p=>p.origen_tipo+':'+p.origen_id+':'+p.rol))
  const lines=[],byV={}
  ;(cuotas||[]).forEach(c=>{const v=vmap[c.venta_id];if(!v)return;(byV[c.venta_id]=byV[c.venta_id]||[]).push(c)})
  Object.keys(byV).forEach(vid=>{const v=vmap[vid],cap=(v.base_comisionable!=null&&Number(v.base_comisionable)>0)?Number(v.base_comisionable):Infinity;let cum=0
    byV[vid].forEach(c=>{const before=cum,m=Number(c.monto||0);cum+=m;const comBase=Math.max(0,Math.min(cap,cum)-Math.min(cap,before))
      const label=(v.leads&&v.leads.nombre)||v.cliente||'—',moneda=v.moneda||'USD'
      if(v.setter_id)lines.push({tipo:'cuota',id:c.id,rol:'setter',personaId:v.setter_id,moneda,monto:comBase*Number(v.com_setter_pct||0)/100,label})
      if(v.closer_id)lines.push({tipo:'cuota',id:c.id,rol:'closer',personaId:v.closer_id,moneda,monto:comBase*Number(v.com_closer_pct||0)/100,label})})})
  COM_LINES=lines
  const keyOf=l=>l.tipo+':'+l.id+':'+l.rol
  const roleAgg=rol=>{const o={};lines.filter(l=>l.rol===rol).forEach(l=>{const k=l.personaId+':'+l.moneda,a=o[k]=o[k]||{dev:0,pag:0,personaId:l.personaId,moneda:l.moneda};a.dev+=l.monto;if(paid.has(keyOf(l)))a.pag+=l.monto})
    return Object.values(o)}
  const tbl=(rows,rol)=>rows.length?`<div class="tablewrap" style="margin:0"><table><thead><tr><th>Persona</th><th>Moneda</th><th>Ganado</th><th>Pagado</th><th>Pendiente</th></tr></thead><tbody>${rows.map(r=>`<tr class="clk" data-det="${rol}|${r.personaId}|${r.moneda}"><td class="nm">${esc(nameOf(r.personaId)||'—')}</td><td class="sub2">${r.moneda}</td><td>${fmtCur(r.dev,r.moneda)}</td><td>${fmtCur(r.pag,r.moneda)}</td><td class="nm">${fmtCur(r.dev-r.pag,r.moneda)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Sin comisiones todavía.</div>'
  document.getElementById('setTbl').innerHTML=tbl(roleAgg('setter'),'setter')
  document.getElementById('cloTbl').innerHTML=tbl(roleAgg('closer'),'closer')
  document.querySelectorAll('[data-det]').forEach(tr=>tr.onclick=()=>{const[rol,personaId,moneda]=tr.dataset.det.split('|');openComDetalle(rol,personaId,moneda)})}
async function openComDetalle(rol,personaId,moneda){const ov=document.createElement('div');ov.className='overlay'
  const mine=COM_LINES.filter(l=>l.rol===rol&&l.personaId===personaId&&l.moneda===moneda&&l.monto>0.005)
  const{data:pagos}=await sb.from('comision_pagos').select('origen_tipo,origen_id,rol')
  const paid=new Set((pagos||[]).map(p=>p.origen_tipo+':'+p.origen_id+':'+p.rol))
  const keyOf=l=>l.tipo+':'+l.id+':'+l.rol
  const{data:manuals}=await sb.from('pagos_manuales').select('*').eq('persona_id',personaId).eq('rol',rol).eq('moneda',moneda).order('pagado_at',{ascending:false})
  const manualTotal=(manuals||[]).reduce((a,m)=>a+Number(m.monto_usd||0),0)
  const draw=()=>{const dev=mine.reduce((a,l)=>a+l.monto,0),pag=mine.filter(l=>paid.has(keyOf(l))).reduce((a,l)=>a+l.monto,0)+manualTotal
    ov.querySelector('#cd_sum').innerHTML=`<div class="row3"><div><div class="sub2">Ganado</div><div class="nm">${fmtCur(dev,moneda)}</div></div><div><div class="sub2">Pagado</div><div class="nm">${fmtCur(pag,moneda)}</div></div><div><div class="sub2">Pendiente</div><div class="nm">${fmtCur(dev-pag,moneda)}</div></div></div>`
    ov.querySelector('#cd_body').innerHTML=mine.length?mine.map(l=>{const pd=paid.has(keyOf(l))
      return `<tr><td class="sub2">${esc(l.label)}</td><td>${fmtCur(l.monto,moneda)}</td><td>${pd?'<span class="chip cobrado">pagada</span>':'<span class="chip pendiente">pend.</span>'}</td>${isMgr()?`<td><button class="pg" data-tog="${keyOf(l)}">${pd?'quitar':'pagar'}</button></td>`:''}</tr>`}).join(''):'<tr><td colspan="4" class="empty">Sin líneas.</td></tr>'
    ov.querySelector('#cd_manbody').innerHTML=(manuals&&manuals.length)?manuals.map(m=>`<tr><td class="sub2">${fmtDateTime(m.pagado_at)}</td><td class="nm">${fmtCur(m.monto_usd,moneda)}</td><td class="sub2">${esc(m.nota||'')}</td>${isMgr()?`<td><button class="pg" data-delman="${m.id}">quitar</button></td>`:''}</tr>`).join(''):'<tr><td colspan="4" class="empty">Sin pagos manuales.</td></tr>'
    ov.querySelectorAll('[data-tog]').forEach(b=>b.onclick=async()=>{const[tipo,id,r]=b.dataset.tog.split(':'),l=mine.find(x=>keyOf(x)===b.dataset.tog),m={origen_tipo:tipo,origen_id:id,rol:r}
      if(paid.has(b.dataset.tog)){await sb.from('comision_pagos').delete().match(m);paid.delete(b.dataset.tog)}
      else{await sb.from('comision_pagos').insert({...m,persona_id:personaId,pagado_by:me.id});paid.add(b.dataset.tog)}
      draw()})
    ov.querySelectorAll('[data-delman]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Quitar este pago?'))return;await sb.from('pagos_manuales').delete().eq('id',b.dataset.delman);toast('Quitado ✓');ov.remove();openComDetalle(rol,personaId,moneda)})}
  ov.innerHTML=`<div class="modal"><h2>${esc(nameOf(personaId))} · comisión ${rol} · ${moneda}</h2><div id="cd_sum" style="margin-bottom:14px"></div>
    <div class="tablewrap" style="margin:0"><table><thead><tr><th>Venta</th><th>Comisión</th><th>Estado</th>${isMgr()?'<th></th>':''}</tr></thead><tbody id="cd_body"></tbody></table></div>
    ${isMgr()?`<div class="row3" style="margin-top:16px"><div class="field"><label>Pago manual (${moneda})</label><input class="inp" id="cd_manmonto" type="number" step="0.01"/></div><div class="field"><label>Nota</label><input class="inp" id="cd_mannota"/></div><div class="field" style="display:flex;align-items:flex-end"><button class="btn primary" id="cd_manadd" style="width:100%">Registrar pago</button></div></div>`:''}
    <div class="tablewrap" style="margin:12px 0 0"><table><thead><tr><th>Fecha</th><th>Monto</th><th>Nota</th>${isMgr()?'<th></th>':''}</tr></thead><tbody id="cd_manbody"></tbody></table></div>
    <div class="actions"><div class="grow"></div><button class="btn ghost" id="c">Cerrar</button></div></div>`
  document.body.appendChild(ov);ov.onclick=e=>{if(e.target===ov)ov.remove()};ov.querySelector('#c').onclick=()=>ov.remove()
  const ab=ov.querySelector('#cd_manadd');if(ab)ab.onclick=async()=>{const monto=Number(ov.querySelector('#cd_manmonto').value||0),nota=ov.querySelector('#cd_mannota').value.trim()
    if(monto<=0){toast('Cargá un monto');return}
    const{error}=await sb.from('pagos_manuales').insert({persona_id:personaId,rol,moneda,monto_usd:monto,nota:nota||null,pagado_by:me.id})
    if(error){toast('Error: '+error.message);return}
    toast('Pago registrado ✓');ov.remove();openComDetalle(rol,personaId,moneda)}
  draw()}

  <div class="card"><h3>Marketing</h3><p class="cdesc">Cargá cada pieza de contenido con su tag, plataforma y resultados (chats, leads, calificados, ventas, generado) para ver qué está funcionando.</p></div>
